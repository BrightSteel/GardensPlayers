plugins {
    id 'java'
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.21"
    id("com.gradleup.shadow") version "9.4.2"
}

group = 'com.gardensmc'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "CodeMC"
        url = uri("https://repo.codemc.io/repository/maven-public/")
    }
    maven {
        url = "https://jitpack.io/"
    }
    maven {
        url = "https://maven.enginehub.org/repo/"
    }
    maven {
        url = "https://repo.dmulloy2.net/repository/public/"
    }
    maven {
        url = "https://repo.minebench.de/"
    }
    maven { url 'https://mvn.lumine.io/repository/maven-public/' }

    maven {
        url = 'https://repo.extendedclip.com/releases/'
    }
    maven {
        url "https://repo.hibiscusmc.com/releases"
    }
    maven {
        url = uri("https://repo.opencollab.dev/main/")
    }
    maven {
        url = "https://repo.momirealms.net/releases/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.1.2.build.+")
    paperweight.paperDevBundle("26.1.2.build.+")

    compileOnly("de.tr7zw:item-nbt-api-plugin:2.15.7")
    compileOnly(fileTree("${project.rootDir}/dependencies") { include("*.jar") })
    implementation("de.themoep:inventorygui:1.6.5-SNAPSHOT")
    compileOnly("com.github.MilkBowl:VaultAPI:1.7.1")
    compileOnly 'org.projectlombok:lombok:1.18.46'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    // Caffeine and HikariCP are downloaded by Paper at startup via plugin.yml `libraries:` (keep versions in sync)
    compileOnly("com.zaxxer:HikariCP:5.0.1")
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.18-SNAPSHOT'
    compileOnly("com.github.GriefPrevention:GriefPrevention:16.18.4")
    compileOnly("com.github.retrooper:packetevents-spigot:2.11.0")
    compileOnly('com.github.brcdev-minecraft:shopgui-api:3.0.0') {
        exclude(group: "org.spigotmc")
    }
    compileOnly "com.hibiscusmc:HMCCosmetics:2.8.1-937f66e8"
    compileOnly("org.popcraft:chunky-common:1.3.38")
    compileOnly('org.geysermc.floodgate:api:2.2.4-SNAPSHOT')
    compileOnly("net.momirealms:custom-fishing:2.3.7")
    compileOnly("com.github.ben-manes.caffeine:caffeine:3.1.8")
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'

    // unit tests run without a server: these are only on the classpath, never started
    testImplementation(platform("org.junit:junit-bom:5.12.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("io.papermc.paper:paper-api:26.1.2.build.+")
    testImplementation("com.github.MilkBowl:VaultAPI:1.7.1")
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks {
    build {
        dependsOn(shadowJar)
    }

    shadowJar {
        relocate("de.themoep", "com.gardensmc.shaded.inventorygui")
    }

}

test {
    useJUnitPlatform()
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

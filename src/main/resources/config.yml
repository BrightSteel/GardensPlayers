database:
  host: 'localhost'
  port: 3306
  databaseName: ''
  username: ''
  password: ''
economy:
  currencySymbol: '$'
  startingBalance: 250
  # cost in acorns to teleport back to your death location via the clickable death message
  deathBackCost: 250
messages:
  prefix: '[Gardens]'
  mainColor: '<green>'
  errorColor: '<red>'
resourceWorldRadius: 8000
# /rtp. Finding safe spots ahead of time generates chunks, so a dev server can turn it off.
rtp:
  enabled: true
resourceWorlds:
  # Border radius (blocks) of each resource world; pregenerated a further 250 out so the border never generates chunks.
  # From prod's usage over 4 months: RTP spreads players over the whole overworld, while the Nether and End see far less.
  radius:
    resource_world: 6000
    resource_nether: 4000
    resource_the_end: 4000
  # Swap in fresh resource worlds once a month (the first startup or hourly check on/after this day, Los Angeles time).
  reset:
    enabled: true
    day-of-month: 1
  # Pregenerated worlds kept in Cloudflare R2 (or any S3-compatible storage) instead of on this server's disk.
  storage:
    enabled: false
    # https://<account id>.r2.cloudflarestorage.com
    endpoint: ''
    bucket: ''
    access-key: ''
    secret-key: ''
    region: auto
    prefix: 'resource-worlds/'
    # The machine that runs /genresource: upload each finished world, then delete it here.
    upload-generated: false
    # A server that resets: keep this many sets downloaded ahead of the next reset (each set ~7-8 GB at the radii above).
    keep-local: 1
